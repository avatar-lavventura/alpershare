<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>alpershare</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128221;</text></svg>">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #282a36; color: #f8f8f2; font-family: monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #bar { height: 32px; padding: 0 12px; background: #21222c; border-bottom: 1px solid #44475a; display: flex; align-items: center; gap: 12px; font-size: 12px; flex-shrink: 0; }
select { background: #44475a; color: #f8f8f2; border: 1px solid #6272a4; padding: 2px 6px; font-size: 12px; outline: none; border-radius: 3px; }
    button { background: #44475a; color: #f8f8f2; border: 1px solid #6272a4; padding: 2px 8px; font-size: 12px; cursor: pointer; border-radius: 3px; }
    button:hover { background: #6272a4; }
    #typing { margin-left: auto; font-size: 11px; color: #f1fa8c; }
    #status { font-size: 11px; }
    .on { color: #50fa7b; }
    .off { color: #6272a4; }
    #editor { flex: 1; }
    #imgs { display: flex; gap: 6px; padding: 6px 12px; background: #21222c; border-bottom: 1px solid #44475a; overflow-x: auto; flex-shrink: 0; }
    #imgs:empty { display: none; }
    .thumb { position: relative; flex-shrink: 0; }
    .thumb img { height: 64px; display: block; cursor: pointer; }
    .thumb button { position: absolute; top: 0; right: 0; padding: 0 4px; }
    #view { position: fixed; inset: 0; background: #000c; display: flex; align-items: center; justify-content: center; z-index: 100; }
    #view[hidden] { display: none; }
    #view img { max-width: 95%; max-height: 95%; }
  </style>
</head>
<body>
  <div id="bar">
<select id="lang">
      <option value="markdown">Markdown</option>
      <option value="org">Org-mode</option>
    </select>
    <button id="undo" title="Undo (Ctrl+Z)">&#8634;</button>
    <button id="redo" title="Redo (Ctrl+Y)">&#8635;</button>
    <button id="refresh" title="Refresh">&#128260;</button>
    <button id="push" title="Push my text to everyone">&#8593;</button>
    <span id="typing"></span>
    <span id="status" class="off">connecting</span>
  </div>
  <div id="imgs"></div>
  <div id="editor"></div>
  <div id="view" hidden onclick="this.hidden = true"><img></div>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
  <script>
    const langEl = document.getElementById('lang');
    const statusEl = document.getElementById('status');
    const typingEl = document.getElementById('typing');
    let typingTimer;

let editor, model, ws, retry = 0, typedAt = 0, lastRecv = 0, pingAt = 0, sendTimer = null;
    let mute = false;
    let early = []; // messages that arrive before Monaco is ready
    const room = new URLSearchParams(location.search).get('room') || '';
    const imgsEl = document.getElementById('imgs');
    const viewEl = document.getElementById('view');

    const imgUrl = id => `/img/${encodeURIComponent(id)}?room=${encodeURIComponent(room)}`;
    // one thumbnail per image; add and delete touch only that one, so the others are not decoded again
    function thumb(id, src) {
      const t = document.createElement('span');
      t.className = 'thumb';
      t.dataset.id = id;
      const img = new Image();
      img.src = src;
      img.onclick = () => { viewEl.firstChild.src = src; viewEl.hidden = false; };
      const x = document.createElement('button');
      x.textContent = '\u00d7';
      x.onclick = () => { delImg(id); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'imgdel', id })); };
      t.append(img, x);
      return t;
    }
    function setImgs(ids) { imgsEl.replaceChildren(...ids.slice(-20).map(id => thumb(id, imgUrl(id)))); }
    function addImg(id, src) {
      imgsEl.append(thumb(id, src));
      while (imgsEl.children.length > 20) imgsEl.firstChild.remove();
    }
    function delImg(id) { [...imgsEl.children].find(t => t.dataset.id === id)?.remove(); }

    // whole document, at most once per 50 ms, so fast typing does not send a copy per keystroke
    function sendContent() {
      sendTimer = null;
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'update', content: model.getValue() }));
    }

    // 5 MB file is ~7 MB as base64, under the servers' 8 MB message limit
    function shareFile(f) {
      if (!f.type.startsWith('image/')) return;
      if (f.size > 5 * 1024 * 1024) return alert('Image too big (max 5 MB)');
      const r = new FileReader();
      r.onload = () => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return alert('Offline, image not shared');
        const id = Date.now().toString(36) + Math.random().toString(36).slice(2);
        addImg(id, r.result);
        ws.send(JSON.stringify({ type: 'img', id, data: r.result }));
      };
      r.readAsDataURL(f);
    }
    // capture phase so Monaco never sees image drops/pastes; text pastes and drags pass through
    addEventListener('dragover', e => e.preventDefault(), true);
    addEventListener('drop', e => {
      if (!e.dataTransfer.files.length) return;
      e.preventDefault(); e.stopPropagation();
      [...e.dataTransfer.files].forEach(shareFile);
    }, true);
    addEventListener('paste', e => {
      const files = [...e.clipboardData.files].filter(f => f.type.startsWith('image/'));
      if (!files.length || e.clipboardData.getData('text/plain')) return;
      e.preventDefault(); e.stopPropagation();
      files.forEach(shareFile);
    }, true);

    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs' } });
    require(['vs/editor/editor.main'], () => {
      monaco.languages.register({ id: 'org' });
      monaco.languages.setMonarchTokensProvider('org', {
        tokenizer: {
          root: [
            // Headings
            [/^\*{1,8} .+$/, 'org.heading'],
            // Keyword lines: #+TITLE, #+BEGIN_SRC, etc.
            [/^#\+[A-Z_]+.*$/, 'org.keyword'],
            // Comment lines
            [/^#(?!\+).+$/, 'comment'],
            // TODO keywords inline
            [/\b(TODO|DONE|FIXME|WAITING|CANCELLED|NEXT)\b/, 'org.todo'],
            // Tags at end of heading :tag:tag:
            [/:[a-zA-Z0-9_@#%:]+:/, 'org.tag'],
            // Bold *word*
            [/\*[^*\n]+\*/, 'org.bold'],
            // Italic /word/
            [/\/[^/\n]+\//, 'org.italic'],
            // Underline _word_
            [/_[^_\n]+_/, 'org.underline'],
            // Code ~word~ or =word=
            [/[~=][^~=\n]+[~=]/, 'org.code'],
            // Strikethrough +word+
            [/\+[^+\n]+\+/, 'org.strikethrough'],
            // Links [[url][desc]] or [[url]]
            [/\[\[.*?\]\]/, 'org.link'],
            // Property drawers :PROPERTIES: / :END:
            [/^:(PROPERTIES|END|LOGBOOK):$/, 'org.meta'],
            [/^:[A-Z_]+:.*$/, 'org.meta'],
            // Timestamps
            [/[<[]\d{4}-\d{2}-\d{2}[^\]>]*[\]>]/, 'org.timestamp'],
          ],
        },
      });
      monaco.editor.defineTheme('dracula', {
        base: 'vs-dark',
        inherit: true,
        rules: [
          { token: '',             foreground: 'f8f8f2', background: '282a36' },
          { token: 'comment',      foreground: '6272a4', fontStyle: 'italic' },
          { token: 'keyword',      foreground: 'ff79c6' },
          { token: 'string',       foreground: 'f1fa8c' },
          { token: 'number',       foreground: 'bd93f9' },
          { token: 'regexp',       foreground: 'f1fa8c' },
          { token: 'type',         foreground: '8be9fd', fontStyle: 'italic' },
          { token: 'class',        foreground: '50fa7b' },
          { token: 'function',     foreground: '50fa7b' },
          { token: 'variable',     foreground: 'f8f8f2' },
          { token: 'constant',     foreground: 'bd93f9' },
          { token: 'operator',     foreground: 'ff79c6' },
          { token: 'delimiter',    foreground: 'f8f8f2' },
          { token: 'tag',          foreground: 'ff79c6' },
          { token: 'attribute.name',  foreground: '50fa7b' },
          { token: 'attribute.value', foreground: 'f1fa8c' },
          { token: 'org.heading',     foreground: 'bd93f9', fontStyle: 'bold' },
          { token: 'org.keyword',     foreground: 'ff79c6' },
          { token: 'org.todo',        foreground: 'ff5555', fontStyle: 'bold' },
          { token: 'org.tag',         foreground: '6272a4' },
          { token: 'org.bold',        foreground: 'f8f8f2', fontStyle: 'bold' },
          { token: 'org.italic',      foreground: 'f8f8f2', fontStyle: 'italic' },
          { token: 'org.underline',   foreground: 'f8f8f2', fontStyle: 'underline' },
          { token: 'org.code',        foreground: '50fa7b' },
          { token: 'org.strikethrough', foreground: '6272a4' },
          { token: 'org.link',        foreground: '8be9fd' },
          { token: 'org.meta',        foreground: 'ffb86c' },
          { token: 'org.timestamp',   foreground: 'f1fa8c' },
        ],
        colors: {
          'editor.background':            '#282a36',
          'editor.foreground':            '#f8f8f2',
          'editor.lineHighlightBackground': '#44475a',
          'editor.selectionBackground':   '#44475a',
          'editorCursor.foreground':      '#ffffff',
          'editorLineNumber.foreground':  '#6272a4',
          'editorLineNumber.activeForeground': '#f8f8f2',
          'editor.findMatchBackground':   '#ffb86c50',
          'editor.findMatchHighlightBackground': '#ffffff20',
          'editorWidget.background':      '#21222c',
          'editorWidget.border':          '#6272a4',
          'input.background':             '#44475a',
          'input.foreground':             '#f8f8f2',
          'scrollbarSlider.background':   '#44475a80',
          'scrollbarSlider.hoverBackground': '#6272a4',
        },
      });

      editor = monaco.editor.create(document.getElementById('editor'), {
        value: '',
        language: 'markdown',
        theme: 'dracula',
        fontSize: 14,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        automaticLayout: true,
        padding: { top: 8 },
        cursorBlinking: 'solid',
        quickSuggestions: false,
        suggestOnTriggerCharacters: false,
        wordBasedSuggestions: 'off',
        acceptSuggestionOnEnter: 'off',
        tabCompletion: 'off',
        parameterHints: { enabled: false },
      });

      model = editor.getModel();

      const inputArea = editor.getDomNode().querySelector('textarea');
      inputArea.setAttribute('spellcheck', 'false');
      inputArea.setAttribute('autocorrect', 'off');
      inputArea.setAttribute('autocapitalize', 'off');
      inputArea.setAttribute('autocomplete', 'off');

      document.getElementById('undo').onclick = () => editor.trigger('toolbar', 'undo', null);
      document.getElementById('redo').onclick = () => editor.trigger('toolbar', 'redo', null);
      document.getElementById('refresh').onclick = () => location.reload();
      // counts as typing, so if the socket is down or dead the next init pushes ours
      document.getElementById('push').onclick = () => {
        typedAt = Date.now();
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'update', content: model.getValue() }));
      };

      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Minus, () => editor.trigger('keyboard', 'undo', null));
      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyG, () => {});
      editor.addCommand(monaco.KeyMod.WinCtrl | monaco.KeyCode.KeyG, () => {}); // Mac: Ctrl+G is go-to-line

      // mouse drag past the end stops at the last non-whitespace char, so trailing blank lines are not copied
      editor.onDidChangeCursorSelection(({ selection: s, source }) => {
        if (source !== 'mouse' || s.isEmpty()) return;
        let line = model.getLineCount();
        while (line > 1 && !model.getLineLastNonWhitespaceColumn(line)) line--;
        const end = new monaco.Position(line, Math.max(1, model.getLineLastNonWhitespaceColumn(line)));
        const clamp = p => end.isBefore(p) ? end : p;
        const a = clamp(s.getSelectionStart()), b = clamp(s.getPosition());
        if (!a.equals(s.getSelectionStart()) || !b.equals(s.getPosition())) editor.setSelection(monaco.Selection.fromPositions(a, b));
      });

      editor.onDidChangeModelContent(() => {
        if (mute) return;
        typedAt = Date.now();
        if (!sendTimer) sendTimer = setTimeout(sendContent, 50);
      });

      langEl.onchange = () => {
        monaco.editor.setModelLanguage(model, langEl.value);
        if (ws && ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify({ type: 'lang', lang: langEl.value }));
      };

      early.forEach(([msg, since]) => handle(msg, since));
      early = null;
    });
    connect(); // in parallel with loading Monaco

    // half-open sockets (sleep, network switch) stay OPEN forever; no pong since last ping = dead, reconnect
    setInterval(() => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      if (pingAt > lastRecv) { ws.onclose = ws.onmessage = null; ws.close(); connect(); return; }
      pingAt = Date.now();
      ws.send('{"type":"ping"}');
    }, 10000);

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/?room=${encodeURIComponent(room)}`);

      ws.onopen = () => { retry = 0; statusEl.textContent = 'live'; statusEl.className = 'on'; };
      ws.onclose = () => { statusEl.textContent = 'offline'; statusEl.className = 'off'; setTimeout(connect, Date.now() - typedAt < 36e5 ? 2000 : Math.min(60000, 2000 * 2 ** retry++)); };

      ws.onmessage = (e) => {
        const since = lastRecv;
        lastRecv = Date.now();
        const msg = JSON.parse(e.data);
        if (early) early.push([msg, since]);
        else handle(msg, since);
      };
    }

    function handle(msg, since) {
      // typed since the server last answered: server may not have our edits, push ours instead of reverting
      // ponytail: last writer wins, a peer's offline edits get overwritten; CRDT (yjs) if that matters
      if (msg.type === 'init' && typedAt > since && model.getValue() !== msg.content) {
        ws.send(JSON.stringify({ type: 'update', content: model.getValue() }));
      } else if (msg.type === 'init' || msg.type === 'update') {
        applyRemoteContent(msg.content);
      }
      if (msg.type === 'init') setImgs((msg.images || []).map(m => m.id));
      if (msg.type === 'img') addImg(msg.id, imgUrl(msg.id));
      if (msg.type === 'imgdel') delImg(msg.id);
      if (msg.type === 'update') {
        typingEl.textContent = 'typing...';
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => { typingEl.textContent = ''; }, 1500);
      }
      if ((msg.type === 'init' || msg.type === 'lang') && msg.lang) {
        langEl.value = msg.lang;
        monaco.editor.setModelLanguage(model, msg.lang);
      }
    }

    // Apply remote content as a minimal edit instead of setValue(),
    // so the local undo/redo stack survives incoming remote updates.
    function applyRemoteContent(newContent) {
      const oldContent = model.getValue();
      if (oldContent === newContent) return;

      const maxPrefix = Math.min(oldContent.length, newContent.length);
      let prefix = 0;
      while (prefix < maxPrefix && oldContent[prefix] === newContent[prefix]) prefix++;

      const maxSuffix = Math.min(oldContent.length, newContent.length) - prefix;
      let suffix = 0;
      while (suffix < maxSuffix && oldContent[oldContent.length - 1 - suffix] === newContent[newContent.length - 1 - suffix]) suffix++;

      const startPos = model.getPositionAt(prefix);
      const endPos = model.getPositionAt(oldContent.length - suffix);
      const insertText = newContent.slice(prefix, newContent.length - suffix);

      mute = true;
      model.applyEdits([{ range: monaco.Range.fromPositions(startPos, endPos), text: insertText }]);
      mute = false;
    }
  </script>
</body>
</html>
